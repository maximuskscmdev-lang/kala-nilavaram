# Supabase CLI project config (generated by `supabase init`, trimmed to the
# fields this project actually needs — regenerate the full file with
# `supabase init` if you need e.g. custom auth email templates).

project_id = "kala-nilavaram"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://kalanilavaram.com"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
# Email OTP / magic-link sign-in. No SMS provider needed — Supabase sends the
# link/code to the user's inbox and auto-creates the account on first login.

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[storage]
enabled = true
file_size_limit = "20MiB"
